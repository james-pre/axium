name: Release

on:
    release:
        types: [created]

jobs:
    ci:
        uses: ./.github/workflows/ci.yaml
        permissions:
            contents: read
    release:
        runs-on: ubuntu-latest
        needs: ci
        permissions:
            id-token: write
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: latest
                  registry-url: https://registry.npmjs.org/

            - name: Use latest npm version
              run: npm install -g npm@latest

            - name: Install dependencies
              run: npm ci

            - name: Resolve package
              id: resolve
              run: npx monorepo release resolve "$TAG"
              env:
                  TAG: ${{ github.event.release.tag_name }}

            - name: Build (TypeScript)
              run: npx tsc -b

            - name: Build server
              run: cd packages/server && npx axium build

            - name: Export schemas
              run: cd packages/server && npm run build:schemas

            - name: Publish
              run: npm publish --access=public --provenance
              working-directory: ${{ steps.resolve.outputs.path }}
